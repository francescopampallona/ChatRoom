name: chatroom

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatroom}
      MYSQL_USER: ${MYSQL_USER:-chatroom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatroom-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chatroom-local-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 30
      # Initializing an empty volume can take several minutes on Docker Desktop.
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: ./chatroom
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatroom}
      MYSQL_USER: ${MYSQL_USER:-chatroom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatroom-local-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-at-least-32-bytes}
      CHATROOM_AI_ENABLED: ${AI_ENABLED:-true}
      CHATROOM_AI_BASEURL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHATROOM_AI_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CHATROOM_AI_INTERVALSECONDS: ${AI_INTERVAL_SECONDS:-15}
      CHATROOM_AI_MAXAUTONOMOUSTURNS: ${AI_MAX_AUTONOMOUS_TURNS:-6}
      CHATROOM_AI_REQUESTTIMEOUTSECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./chatroom-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  ollama_models:
