# Compose supplies database credentials and the JWT signing key at runtime.
spring.datasource.url=jdbc:mysql://db:3306/${MYSQL_DATABASE:chatroom}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:chatroom}
spring.datasource.password=${MYSQL_PASSWORD}
jwt.secret=${JWT_SECRET}

# Nginx preserves the browser's host and forwards its protocol.
server.forward-headers-strategy=framework

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
